name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "sites/**"
      - "site-worker.js"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

# Every site is redeployed on each run; a deploy with no changes is a no-op.

jobs:
  deploy:
    name: Deploy ${{ matrix.site }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: iamfatness.us
            config: wrangler.jsonc
          - site: swarmscribe.iamfatness.us
            config: sites/swarmscribe/wrangler.jsonc
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate Cloudflare configuration
        id: cloudflare_config
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            {
              echo "Cloudflare deploy skipped."
              echo
              echo "Set CLOUDFLARE_API_TOKEN as a repository secret and"
              echo "CLOUDFLARE_ACCOUNT_ID as either a repository secret or variable"
              echo "to enable deployment to ${{ matrix.site }}."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Workers
        if: steps.cloudflare_config.outputs.deploy_enabled == 'true'
        run: npx wrangler@latest deploy --config ${{ matrix.config }}
